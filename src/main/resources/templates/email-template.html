<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件模板测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 20px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>邮件模板测试</h1>
    </div>
    
    <div class="content">
        <h2>你好，<span th:text="${userName}">用户名</span>！</h2>
        
        <p>您的邮箱：<strong th:text="${email}">email@example.com</strong></p>
        <p>订单号：<strong th:text="${orderId}">12345</strong></p>
        
        <!-- 条件判断示例 -->
        <div th:if="${orderId != null}">
            <p>✅ 订单信息已加载</p>
        </div>
        
        <!-- 循环示例 -->
        <h3>订单项目：</h3>
        <ul>
            <li th:each="item : ${items}" th:text="${item}">项目</li>
        </ul>
        
        <!-- 更多 Thymeleaf 语法示例 -->
        <p th:text="'欢迎，' + ${userName} + '！'">欢迎消息</p>
    </div>
</body>
</html>
