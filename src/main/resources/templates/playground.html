<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thymeleaf Playground</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: rgba(255,255,255,0.06);
            --panel2: rgba(255,255,255,0.09);
            --text: rgba(255,255,255,0.92);
            --muted: rgba(255,255,255,0.65);
            --border: rgba(255,255,255,0.12);
            --accent: #4f8cff;
            --danger: #ff5c7a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: radial-gradient(1200px 600px at 10% 10%, rgba(79,140,255,0.25), transparent 60%),
                        radial-gradient(900px 500px at 90% 20%, rgba(255,92,122,0.18), transparent 55%),
                        var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        }
        header {
            padding: 20px 22px 8px;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
            background: rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.2px;
        }
        header p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.35;
        }
        main {
            padding: 18px 22px 26px;
            display: grid;
            /* left | draggable divider | right */
            grid-template-columns: minmax(420px, var(--split-left, 62%)) 10px minmax(360px, 1fr);
            gap: 14px;
            /* Give the right column (including preview iframe) a real height to grow into */
            min-height: calc(100vh - 86px);
        }
        body.preview-full main {
            grid-template-columns: 1fr;
        }
        body.preview-full #templatePanel {
            display: none;
        }
        body.preview-full #colDivider {
            display: none;
        }
        #colDivider {
            align-self: stretch;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            cursor: col-resize;
            position: relative;
        }
        #colDivider::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 10%;
            transform: translateX(-50%);
            width: 2px;
            height: 80%;
            border-radius: 2px;
            background: rgba(255,255,255,0.18);
        }
        #colDivider:hover {
            background: rgba(255,255,255,0.05);
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .panel .bar {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--panel2);
        }
        .panel .bar .title {
            font-size: 13px;
            color: var(--muted);
        }
        .panel .bar .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        button {
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        button.primary {
            border-color: rgba(79,140,255,0.5);
            background: rgba(79,140,255,0.22);
        }
        .seg {
            display: inline-flex;
            gap: 6px;
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
        }
        .seg button {
            padding: 7px 10px;
            border-radius: 10px;
        }
        .seg button.active {
            border-color: rgba(79,140,255,0.55);
            background: rgba(79,140,255,0.22);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        textarea {
            width: 100%;
            min-height: 280px;
            resize: vertical;
            border: 0;
            outline: none;
            padding: 12px;
            background: transparent;
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 12.5px;
            line-height: 1.45;
        }
        /* JSON textarea lives in a fixed-height panel on wide screens, so it must be able to shrink */
        #dataPanel {
            display: flex;
            flex-direction: column;
        }
        #jsonInput {
            min-height: 0;
            flex: 1 1 auto;
            resize: none;
        }
        /* Template textarea: auto-size to content (JS controls height) */
        #templateInput {
            resize: none;
            overflow-y: hidden;
            height: calc(100% - 62.5px) !important;
            /* Let JS autosize control the height; don't fight it with fixed CSS height. */
        }
        .right {
            display: grid;
            /* Make preview area larger by default */
            grid-template-rows: minmax(240px, 35vh) minmax(760px, 1fr);
            gap: 14px;
            /* Allow grid children (flex panels/iframe) to shrink correctly */
            min-height: 0;
        }
        body.preview-full .right {
            grid-template-rows: 1fr;
        }
        body.preview-full .right #dataPanel {
            display: none;
        }
        .error {
            color: #fff;
            background: rgba(255,92,122,0.18);
            border: 1px solid rgba(255,92,122,0.35);
            padding: 10px 12px;
            border-radius: 10px;
            margin: 10px 12px 0;
            display: none;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 60vh;
            overflow: auto;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            line-height: 1.6;
        }
        .error .error-line {
            color: #ff8a9b;
            font-weight: 500;
        }
        .error .error-location {
            color: #ffb3c1;
            margin-top: 8px;
        }
        .error .error-code {
            background: rgba(0,0,0,0.2);
            padding: 2px 4px;
            border-radius: 4px;
            margin: 4px 0;
        }
        .error .error-pointer {
            color: #ff5c7a;
            font-weight: bold;
        }
        #templateInput.error-line-highlight {
            background: rgba(255,92,122,0.08);
        }

        /* Template editor with line-number gutter */
        .code-editor {
            display: flex;
            min-height: 0;
        }
        .code-editor .gutter {
            flex: 0 0 auto;
            width: 54px;
            padding: 12px 8px;
            border-right: 1px solid rgba(255,255,255,0.10);
            color: rgba(255,255,255,0.45);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 12.5px;
            line-height: 1.45;
            text-align: right;
            user-select: none;
            overflow: hidden;
            white-space: pre;
        }
        .code-editor textarea {
            flex: 1 1 auto;
            min-width: 0;
        }
        /* Preview panel needs to host the error box and the iframe */
        #previewPanel {
            display: flex;
            flex-direction: column;
            /* Critical for grid+flex: allow children to shrink instead of being clipped */
            min-height: 0;
        }
        #previewPanel iframe {
            flex: 1 1 auto;
            /* Let the iframe shrink/grow with the panel; avoid "half cut" clipping */
            min-height: 0;
            height: auto;
        }
        iframe {
            width: 100%;
            border: 0;
            background: #fff;
            display: block;
        }
        @media (max-width: 980px) {
            main { grid-template-columns: 1fr; }
            #colDivider { display: none; }
            .right { grid-template-rows: auto minmax(760px, 1fr); }
            textarea { min-height: 260px; }
        }
    </style>
</head>
<body>
<header>
    <h1>Thymeleaf Playground</h1>
    <p>把要测试的 <strong>HTML 模板</strong>（支持 Thymeleaf / Velocity）和要替换的 <strong>JSON</strong> 粘贴进来，点击运行即可预览渲染结果。</p>
</header>

<main>
    <section class="panel" id="templatePanel">
        <div class="bar">
            <div class="title">模板（HTML + <span id="engineLabel">Thymeleaf</span>）</div>
            <div class="actions">
                <div class="seg" title="切换渲染引擎">
                    <button id="btnEngineThymeleaf" type="button">Thymeleaf</button>
                    <button id="btnEngineVelocity" type="button">Velocity</button>
                </div>
                <button id="btnInsertExample" title="填充示例模板">示例</button>
                <button id="btnClearTemplate" title="清空模板">清空</button>
            </div>
        </div>
        <textarea id="templateInput" spellcheck="false"></textarea>
    </section>

    <div id="colDivider" role="separator" aria-orientation="vertical" title="拖动调整左右宽度"></div>

    <div class="right">
        <section class="panel" id="dataPanel">
            <div class="bar">
                <div class="title">数据（JSON 对象）</div>
                <div class="actions">
                    <button id="btnInsertExampleJson" title="填充示例 JSON">示例</button>
                    <button id="btnClearJson" title="清空 JSON">清空</button>
                </div>
            </div>
            <textarea id="jsonInput" spellcheck="false"></textarea>
        </section>

        <section class="panel" id="previewPanel">
            <div class="bar">
                <div class="title">预览（渲染结果）</div>
                <div class="actions">
                    <button id="btnTogglePreviewFull" title="全屏/还原（占满宽度）">全屏预览</button>
                    <button id="btnRun" class="primary">运行</button>
                </div>
            </div>
            <div id="errorBox" class="error"></div>
            <!-- sandbox: avoid scripts; keep styling and images for email template previews -->
            <iframe id="previewFrame" sandbox="allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        </section>
    </div>
</main>

<script>
    const templateInput = document.getElementById('templateInput');
    const jsonInput = document.getElementById('jsonInput');
    const btnRun = document.getElementById('btnRun');
    const errorBox = document.getElementById('errorBox');
    const previewFrame = document.getElementById('previewFrame');
    const engineLabel = document.getElementById('engineLabel');
    const btnEngineThymeleaf = document.getElementById('btnEngineThymeleaf');
    const btnEngineVelocity = document.getElementById('btnEngineVelocity');
    const rightCol = document.querySelector('.right');
    const btnTogglePreviewFull = document.getElementById('btnTogglePreviewFull');
    const templatePanel = document.getElementById('templatePanel');
    const mainEl = document.querySelector('main');
    const colDivider = document.getElementById('colDivider');

    const ENGINE_KEY = 'playground.engine';
    const TEMPLATE_KEY_PREFIX = 'playground.template.';
    const JSON_KEY = 'playground.modelJson';
    const PREVIEW_FULL_KEY = 'playground.previewFull';
    const SPLIT_LEFT_KEY = 'playground.splitLeftPx';

    const exampleTemplateThymeleaf = `<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>邮件模板测试</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background-color: #4CAF50; color: white; padding: 20px; text-align: center; }
    .content { padding: 20px; background-color: #f9f9f9; }
  </style>
</head>
<body>
  <div class="header"><h1>邮件模板测试</h1></div>
  <div class="content">
    <h2>你好，<span th:text="\${userName}">用户名</span>！</h2>
    <p>您的邮箱：<strong th:text="\${email}">email@example.com</strong></p>
    <p>订单号：<strong th:text="\${orderId}">12345</strong></p>
    <div th:if="\${orderId != null}"><p>✅ 订单信息已加载</p></div>
    <h3>订单项目：</h3>
    <ul>
      <li th:each="item : \${items}" th:text="\${item}">项目</li>
    </ul>
    <p th:text="|欢迎，\${userName}！|">欢迎消息</p>
  </div>
</body>
</html>`;

    const exampleTemplateVelocity = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>邮件模板测试</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background-color: #4CAF50; color: white; padding: 20px; text-align: center; }
    .content { padding: 20px; background-color: #f9f9f9; }
  </style>
</head>
<body>
  <div class="header"><h1>邮件模板测试</h1></div>
  <div class="content">
    <h2>你好，$userName！</h2>
    <p>您的邮箱：<strong>$email</strong></p>
    <p>订单号：<strong>$orderId</strong></p>
    #if($orderId)
      <p>✅ 订单信息已加载</p>
    #end
    <h3>订单项目：</h3>
    <ul>
      #foreach($item in $items)
        <li>$item</li>
      #end
    </ul>
    <p>欢迎，$userName！</p>
  </div>
</body>
</html>`;

    const exampleJson = `{
  "userName": "张三",
  "email": "test@example.com",
  "orderId": "12345",
  "items": ["项目1", "项目2", "项目3"]
}`;

    let currentEngine = 'thymeleaf';
    let previewFull = false;

    function autosizeTemplateTextarea() {
        if (!templateInput) return;
        templateInput.style.height = 'auto';

        // Cap the height so it doesn't take over the page for long templates,
        // but keep it large enough to be comfortable for scrolling/editing.
        // Past this height, the textarea will scroll internally.
        const maxHeight = clamp(Math.round(window.innerHeight * 0.45), 220, 520);
        const next = templateInput.scrollHeight;

        if (next > maxHeight) {
            templateInput.style.height = maxHeight + 'px';
            templateInput.style.overflowY = 'auto';
        } else {
            templateInput.style.height = next + 'px';
            templateInput.style.overflowY = 'hidden';
        }
    }

    function clamp(n, min, max) {
        return Math.min(Math.max(n, min), max);
    }

    function applySplitLeftPx(leftPx) {
        if (!mainEl || !Number.isFinite(leftPx)) return;
        mainEl.style.setProperty('--split-left', Math.round(leftPx) + 'px');
    }

    function computeMaxLeftPx() {
        if (!mainEl) return null;
        const mainWidth = mainEl.getBoundingClientRect().width;
        const dividerWidth = 10;
        const minRight = 360;
        return Math.max(420, mainWidth - dividerWidth - minRight);
    }

    function initColumnResize() {
        if (!mainEl || !templatePanel || !colDivider) return;

        // restore saved width
        try {
            const saved = parseInt(localStorage.getItem(SPLIT_LEFT_KEY) || '', 10);
            if (Number.isFinite(saved)) {
                const maxLeft = computeMaxLeftPx();
                if (maxLeft != null) applySplitLeftPx(clamp(saved, 420, maxLeft));
            }
        } catch (_) {}

        colDivider.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;
            // if divider is hidden by media query, ignore
            const cs = window.getComputedStyle(colDivider);
            if (cs.display === 'none') return;

            e.preventDefault();

            const startX = e.clientX;
            const startLeft = templatePanel.getBoundingClientRect().width;
            const maxLeft = computeMaxLeftPx();
            if (maxLeft == null) return;

            let currentLeft = clamp(startLeft, 420, maxLeft);

            const prevCursor = document.body.style.cursor;
            const prevUserSelect = document.body.style.userSelect;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';

            colDivider.setPointerCapture(e.pointerId);

            const onMove = (ev) => {
                const dx = ev.clientX - startX;
                currentLeft = clamp(startLeft + dx, 420, maxLeft);
                applySplitLeftPx(currentLeft);
            };

            const onEnd = () => {
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);
                window.removeEventListener('pointercancel', onEnd);
                document.body.style.cursor = prevCursor;
                document.body.style.userSelect = prevUserSelect;
                try { localStorage.setItem(SPLIT_LEFT_KEY, String(Math.round(currentLeft))); } catch (_) {}
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onEnd, { once: true });
            window.addEventListener('pointercancel', onEnd, { once: true });
        });

        window.addEventListener('resize', () => {
            // keep within bounds on window resize
            try {
                const saved = parseInt(localStorage.getItem(SPLIT_LEFT_KEY) || '', 10);
                if (!Number.isFinite(saved)) return;
                const maxLeft = computeMaxLeftPx();
                if (maxLeft == null) return;
                applySplitLeftPx(clamp(saved, 420, maxLeft));
            } catch (_) {}
        });
    }

    function setError(msg) {
        if (!msg) {
            errorBox.style.display = 'none';
            errorBox.textContent = '';
            errorBox.innerHTML = '';
            previewFrame.style.display = 'block';
            // 清除错误行高亮
            if (templateInput) {
                templateInput.classList.remove('error-line-highlight');
                templateInput.style.background = '';
            }
            return;
        }
        errorBox.style.display = 'block';
        
        // 解析错误信息，提取行号和格式化显示
        const formatted = formatError(msg);
        errorBox.innerHTML = formatted.html;
        
        // 如果有行号，尝试滚动到错误行并高亮
        if (formatted.lineNumber > 0 && templateInput) {
            highlightErrorLine(formatted.lineNumber);
        }
        
        previewFrame.style.display = 'none';
    }

    function formatError(msg) {
        const result = { html: '', lineNumber: 0, columnNumber: 0 };
        
        if (!msg) {
            result.html = '';
            return result;
        }
        
        // 尝试提取行号和列号（支持中文/英文/常见 Thymeleaf 格式）
        const lc = extractLineCol(msg);
        if (lc) {
            result.lineNumber = lc.lineNumber || 0;
            result.columnNumber = lc.columnNumber || 0;
        }
        
        // 格式化错误消息，高亮关键信息
        // 先按行分割，逐行处理
        const lines = msg.split('\n');
        const formattedLines = [];
        
        for (let i = 0; i < lines.length; i++) {
            let line = escapeHtml(lines[i]);
            
            // 高亮行号和列号信息
            line = line.replace(/(行号:\s*\d+)/g, '<span class="error-line">$1</span>');
            line = line.replace(/(列号:\s*\d+)/g, '<span class="error-line">$1</span>');
            
            // 高亮错误位置标记
            line = line.replace(/(📍\s*错误位置:)/g, '<span class="error-location">$1</span>');
            line = line.replace(/(📄\s*错误行内容:)/g, '<span class="error-location">$1</span>');
            
            // 高亮错误行代码（以3-4个空格开头的行，且不是元信息行）
            const trimmed = lines[i].trim();
            if (lines[i].match(/^\s{3,4}/) && trimmed && 
                !trimmed.startsWith('行号:') && !trimmed.startsWith('列号:') && 
                !trimmed.startsWith('模板:') && trimmed !== '^') {
                line = '<span class="error-code">' + trimmed + '</span>';
            }
            
            // 高亮错误指针（^）
            if (trimmed === '^') {
                line = '<span class="error-pointer">   ^</span>';
            }
            
            formattedLines.push(line);
        }
        
        html = formattedLines.join('<br>');
        
        result.html = html;
        return result;
    }

    function extractLineCol(msg) {
        if (!msg) return null;

        // 1) 后端标准格式：行号/列号
        let mLine = msg.match(/行号:\s*(\d+)/);
        let mCol = msg.match(/列号:\s*(\d+)/);
        if (mLine) {
            return {
                lineNumber: parseInt(mLine[1], 10),
                columnNumber: mCol ? parseInt(mCol[1], 10) : 0
            };
        }

        // 2) Thymeleaf/attoparser 常见："(line 12, col 34)" 或 "(line 12, column 34)"
        let m = msg.match(/\(\s*line\s*(\d+)\s*,\s*(?:col|column)\s*(\d+)\s*\)/i);
        if (m) {
            return { lineNumber: parseInt(m[1], 10), columnNumber: parseInt(m[2], 10) };
        }

        // 3) 其他英文变体："line 12, col 34" / "line 12, column 34"
        m = msg.match(/\bline\s*(\d+)\b[^\d]+(?:col|column)\s*(\d+)\b/i);
        if (m) {
            return { lineNumber: parseInt(m[1], 10), columnNumber: parseInt(m[2], 10) };
        }

        // 4) 极简：只给了 line
        m = msg.match(/\bline\b[:\s]*(\d+)/i);
        if (m) {
            return { lineNumber: parseInt(m[1], 10), columnNumber: 0 };
        }

        return null;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function highlightErrorLine(lineNumber) {
        if (!templateInput || lineNumber <= 0) return;
        
        const lines = templateInput.value.split('\n');
        if (lineNumber > lines.length) return;
        
        // 计算错误行的起始位置
        let pos = 0;
        for (let i = 0; i < lineNumber - 1; i++) {
            pos += lines[i].length + 1; // +1 for newline
        }
        
        // 滚动到错误行
        templateInput.focus();
        templateInput.setSelectionRange(pos, pos);
        
        // 计算滚动位置（让错误行在可视区域中间）
        const lineHeight = 18; // 大约的行高
        const visibleLines = Math.floor(templateInput.clientHeight / lineHeight);
        const scrollLine = Math.max(0, lineNumber - Math.floor(visibleLines / 2));
        templateInput.scrollTop = scrollLine * lineHeight;
        
        // 添加高亮样式
        templateInput.classList.add('error-line-highlight');
        
        // 3秒后移除高亮
        setTimeout(() => {
            templateInput.classList.remove('error-line-highlight');
        }, 3000);
    }

    function normalizeEngine(v) {
        const s = (v || '').trim().toLowerCase();
        return (s === 'velocity' || s === 'thymeleaf') ? s : 'thymeleaf';
    }

    function getTemplateStorageKey(engine) {
        return TEMPLATE_KEY_PREFIX + engine;
    }

    function setEngine(engine) {
        engine = normalizeEngine(engine);
        if (engine === currentEngine) return;

        // persist current template draft under previous engine
        try { localStorage.setItem(getTemplateStorageKey(currentEngine), templateInput.value || ''); } catch (_) {}

        currentEngine = engine;
        try { localStorage.setItem(ENGINE_KEY, currentEngine); } catch (_) {}

        // load template draft for new engine (fallback to example)
        let nextTemplate = '';
        try { nextTemplate = localStorage.getItem(getTemplateStorageKey(currentEngine)) || ''; } catch (_) {}
        if (!nextTemplate) {
            nextTemplate = (currentEngine === 'velocity') ? exampleTemplateVelocity : exampleTemplateThymeleaf;
        }
        templateInput.value = nextTemplate;
        autosizeTemplateTextarea();

        // update UI labels
        const isVelocity = currentEngine === 'velocity';
        engineLabel.textContent = isVelocity ? 'Velocity' : 'Thymeleaf';
        btnEngineVelocity.classList.toggle('active', isVelocity);
        btnEngineThymeleaf.classList.toggle('active', !isVelocity);
    }

    function applyPreviewFull() {
        document.body.classList.toggle('preview-full', !!previewFull);
        if (btnTogglePreviewFull) {
            btnTogglePreviewFull.textContent = previewFull ? '退出全屏' : '全屏预览';
        }
        // In full preview mode we hide the template panel to maximize width.
        if (templatePanel) {
            templatePanel.style.display = previewFull ? 'none' : '';
        }
        try { localStorage.setItem(PREVIEW_FULL_KEY, previewFull ? '1' : '0'); } catch (_) {}
    }

    async function runRender() {
        setError(null);
        btnRun.disabled = true;
        btnRun.textContent = '运行中...';

        try {
            try { localStorage.setItem(getTemplateStorageKey(currentEngine), templateInput.value || ''); } catch (_) {}
            try { localStorage.setItem(JSON_KEY, jsonInput.value || ''); } catch (_) {}

            const resp = await fetch('/playground/render', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    engine: currentEngine,
                    template: templateInput.value,
                    modelJson: jsonInput.value
                })
            });
            
            let data = null;
            let errorText = null;
            
            // 尝试解析响应，无论是成功还是失败
            try {
                const text = await resp.text();
                if (text) {
                    try {
                        data = JSON.parse(text);
                    } catch (e) {
                        // 如果不是 JSON，保存原始文本
                        errorText = text;
                    }
                }
            } catch (e) {
                // 忽略解析错误
            }
            
            if (!resp.ok) {
                // 优先显示服务器返回的错误信息
                if (data && data.error) {
                    setError(data.error);
                } else if (errorText) {
                    setError('服务器错误: ' + errorText);
                } else {
                    setError('请求失败：HTTP ' + resp.status + ' ' + resp.statusText);
                }
                return;
            }
            if (!data || !data.renderedHtml) {
                setError('渲染返回为空');
                return;
            }
            setError(null); // 确保清除错误并显示 iframe
            previewFrame.srcdoc = data.renderedHtml;
        } catch (e) {
            setError('请求异常：' + (e && e.message ? e.message : String(e)));
        } finally {
            btnRun.disabled = false;
            btnRun.textContent = '运行';
        }
    }

    document.getElementById('btnRun').addEventListener('click', runRender);
    document.getElementById('btnInsertExample').addEventListener('click', () => {
        templateInput.value = (currentEngine === 'velocity') ? exampleTemplateVelocity : exampleTemplateThymeleaf;
        autosizeTemplateTextarea();
    });
    document.getElementById('btnInsertExampleJson').addEventListener('click', () => { jsonInput.value = exampleJson; });
    document.getElementById('btnClearTemplate').addEventListener('click', () => { templateInput.value = ''; });
    document.getElementById('btnClearJson').addEventListener('click', () => { jsonInput.value = ''; });
    btnEngineThymeleaf.addEventListener('click', () => setEngine('thymeleaf'));
    btnEngineVelocity.addEventListener('click', () => setEngine('velocity'));
    if (btnTogglePreviewFull) {
        btnTogglePreviewFull.addEventListener('click', () => {
            previewFull = !previewFull;
            applyPreviewFull();
        });
    }

    // Load defaults on first open
    try { currentEngine = normalizeEngine(localStorage.getItem(ENGINE_KEY)); } catch (_) { currentEngine = 'thymeleaf'; }
    try { previewFull = (localStorage.getItem(PREVIEW_FULL_KEY) === '1'); } catch (_) { previewFull = false; }
    // set initial UI state (without overwriting template yet)
    engineLabel.textContent = (currentEngine === 'velocity') ? 'Velocity' : 'Thymeleaf';
    btnEngineVelocity.classList.toggle('active', currentEngine === 'velocity');
    btnEngineThymeleaf.classList.toggle('active', currentEngine !== 'velocity');

    let savedTemplate = '';
    try { savedTemplate = localStorage.getItem(getTemplateStorageKey(currentEngine)) || ''; } catch (_) {}
    templateInput.value = savedTemplate || ((currentEngine === 'velocity') ? exampleTemplateVelocity : exampleTemplateThymeleaf);
    autosizeTemplateTextarea();
    templateInput.addEventListener('input', autosizeTemplateTextarea);
    window.addEventListener('resize', autosizeTemplateTextarea);

    let savedJson = '';
    try { savedJson = localStorage.getItem(JSON_KEY) || ''; } catch (_) {}
    jsonInput.value = savedJson || exampleJson;
    applyPreviewFull();
    initColumnResize();
    runRender();
</script>
</body>
</html>
